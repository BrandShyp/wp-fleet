[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-fleet"
version = "0.1.0"
description = "Status, updates and cache-setting audits for many WordPress sites over SSH and WP-CLI, with a backup before every update and a check after it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrandShyp LLC" }]

[project.scripts]
wp-fleet = "wp_fleet.__main__:main"

[tool.setuptools]
packages = ["wp_fleet"]
